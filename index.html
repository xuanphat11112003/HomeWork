<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Ôn Tập & Giải Bài Tập - Toán & Tiếng Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      
      --math-color: #0284c7;
      --math-bg: #e0f2fe;
      --math-border: #bae6fd;
      
      --en-color: #7c3aed;
      --en-bg: #f3e8ff;
      --en-border: #ddd6fe;

      --success: #16a34a;
      --success-soft: #dcfce7;
      
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 28px -4px rgba(15, 23, 42, 0.12);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #f5f3ff 100%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      padding: 30px 16px 60px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 32px 36px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #2563eb, #7c3aed, #06b6d4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 26px;
      box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.4);
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #1e293b, #334155);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 2px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #059669;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #a7f3d0;
    }

    .badge-live .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* STATS DASHBOARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .stat-all .stat-icon { background: #eff6ff; color: #2563eb; }
    .stat-math .stat-icon { background: var(--math-bg); color: var(--math-color); }
    .stat-en .stat-icon { background: var(--en-bg); color: var(--en-color); }
    .stat-done .stat-icon { background: var(--success-soft); color: var(--success); }

    .stat-info .stat-num {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .stat-info .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* CONTROLS (SEARCH & TABS) */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 380px;
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fcfdfe;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: white;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 15px;
    }

    /* EXERCISES GRID */
    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 22px;
      margin-bottom: 36px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .card.toan {
      border-top: 4px solid var(--math-color);
    }

    .card.tieng-anh {
      border-top: 4px solid var(--en-color);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 8px;
    }

    .subject-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .subject-tag.toan {
      background: var(--math-bg);
      color: var(--math-color);
      border: 1px solid var(--math-border);
    }

    .subject-tag.tieng-anh {
      background: var(--en-bg);
      color: var(--en-color);
      border: 1px solid var(--en-border);
    }

    .grade-tag {
      font-size: 12px;
      background: #f1f5f9;
      color: #475569;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 50px;
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 40px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      margin-bottom: 16px;
      font-size: 12.5px;
      color: #64748b;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-start {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }

    .card.toan .btn-start {
      background: #0284c7;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }
    .card.toan .btn-start:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .card.tieng-anh .btn-start {
      background: #7c3aed;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
    }
    .card.tieng-anh .btn-start:hover {
      background: #6d28d9;
      transform: translateY(-1px);
    }

    .btn-complete {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-complete:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-complete.done {
      background: var(--success-soft);
      border-color: #86efac;
      color: #15803d;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 16px;
      border: 1px dashed var(--border-color);
      grid-column: 1 / -1;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* GUIDE BOX FOR TEACHER */
    .guide-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .guide-text h4 {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guide-text p {
      font-size: 13.5px;
      color: #94a3b8;
      max-width: 650px;
      line-height: 1.6;
    }

    .guide-text code {
      background: #334155;
      color: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .btn-guide {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-guide:hover {
      background: #7dd3fc;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: white;
      border-radius: 16px;
      max-width: 540px;
      width: 100%;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .modal-steps {
      list-style: none;
      margin-top: 16px;
    }

    .modal-steps li {
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #334155;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .step-badge {
      background: #2563eb;
      color: white;
      font-weight: 700;
      font-size: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .modal-close {
      margin-top: 20px;
      width: 100%;
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-close:hover {
      background: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">📚</div>
        <div>
          <h1 class="brand-title">CỔNG BÀI TẬP VÀ ÔN LUYỆN</h1>
          <p class="brand-sub">Hệ thống bài tập Toán & Tiếng Anh trực tuyến cho học sinh</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="so-tay-tu-vung.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; background: #7c3aed; color: white; text-decoration: none; font-size: 13.5px; font-weight: 700; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);">
          📖 Sổ Từ Vựng & Tạo Bài Tập
        </a>
        <div class="badge-live">
          <span class="dot"></span>
          Hệ thống sẵn sàng
        </div>
      </div>
    </div>
  </header>

  <!-- DASHBOARD STATS -->
  <div class="stats-grid">
    <div class="stat-card stat-all">
      <div class="stat-icon">📑</div>
      <div class="stat-info">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Tổng bài tập</div>
      </div>
    </div>
    <div class="stat-card stat-math">
      <div class="stat-icon">📐</div>
      <div class="stat-info">
        <div class="stat-num" id="stat-math">0</div>
        <div class="stat-label">Môn Toán</div>
      </div>
    </div>
    <div class="stat-card stat-en">
      <div class="stat-icon">🌍</div>
      <div class="stat-info">
        <div class="stat-num" id="stat-en">0</div>
        <div class="stat-label">Môn Tiếng Anh</div>
      </div>
    </div>
    <div class="stat-card stat-done">
      <div class="stat-icon">✅</div>
      <div class="stat-info">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-label">Đã hoàn thành</div>
      </div>
    </div>
  </div>

  <!-- CONTROLS & FILTER -->
  <div class="controls-panel">
    <div class="tabs">
      <button class="tab-btn active" onclick="filterSubject('all', this)">
        <span>🌟</span> Tất cả (<span id="count-all">0</span>)
      </button>
      <button class="tab-btn" onclick="filterSubject('toan', this)">
        <span>📐</span> Toán học (<span id="count-math">0</span>)
      </button>
      <button class="tab-btn" onclick="filterSubject('tieng-anh', this)">
        <span>🌍</span> Tiếng Anh (<span id="count-en">0</span>)
      </button>
      <button class="tab-btn" onclick="filterSubject('done', this)">
        <span>✅</span> Đã làm (<span id="count-done">0</span>)
      </button>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm bài tập..." oninput="handleSearch()">
    </div>
  </div>

  <!-- EXERCISES LIST -->
  <div class="exercise-grid" id="exercise-grid">
    <!-- Cards will be rendered dynamically by JavaScript -->
  </div>

</div>

<!-- DỮ LIỆU BÀI TẬP -->

<!-- DỮ LIỆU BÀI TẬP -->
<script src="data.js"></script>

<script>
  // Quản lý trạng thái hoàn thành trên LocalStorage
  const STORAGE_KEY = 'homework_completed_list';
  function getCompletedList() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
      return [];
    }
  }

  function toggleComplete(id, event) {
    if (event) event.stopPropagation();
    let completed = getCompletedList();
    if (completed.includes(id)) {
      completed = completed.filter(item => item !== id);
    } else {
      completed.push(id);
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
    render();
  }

  let currentTab = 'all';
  let searchQuery = '';

  function filterSubject(sub, btn) {
    currentTab = sub;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function handleSearch() {
    searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
    render();
  }

  function render() {
    const list = window.EXERCISE_DATA || [];
    const completedList = getCompletedList();

    // Thống kê số lượng
    const countMath = list.filter(item => item.subject === 'toan').length;
    const countEn = list.filter(item => item.subject === 'tieng-anh').length;
    const countDone = list.filter(item => completedList.includes(item.id)).length;

    document.getElementById('stat-total').innerText = list.length;
    document.getElementById('stat-math').innerText = countMath;
    document.getElementById('stat-en').innerText = countEn;
    document.getElementById('stat-done').innerText = countDone;

    document.getElementById('count-all').innerText = list.length;
    document.getElementById('count-math').innerText = countMath;
    document.getElementById('count-en').innerText = countEn;
    document.getElementById('count-done').innerText = countDone;

    // Lọc danh sách theo Tab
    let filtered = list.filter(item => {
      if (currentTab === 'toan') return item.subject === 'toan';
      if (currentTab === 'tieng-anh') return item.subject === 'tieng-anh';
      if (currentTab === 'done') return completedList.includes(item.id);
      return true;
    });

    // Lọc theo Tìm kiếm
    if (searchQuery) {
      filtered = filtered.filter(item => {
        const titleMatch = item.title.toLowerCase().includes(searchQuery);
        const descMatch = (item.description || '').toLowerCase().includes(searchQuery);
        const fileMatch = item.file.toLowerCase().includes(searchQuery);
        return titleMatch || descMatch || fileMatch;
      });
    }

    const grid = document.getElementById('exercise-grid');

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>Không tìm thấy bài tập nào</h3>
          <p>Thử tìm kiếm với từ khóa khác hoặc chuyển sang danh mục khác.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = filtered.map(item => {
      const isDone = completedList.includes(item.id);
      const isMath = item.subject === 'toan';
      const subjectLabel = isMath ? 'Toán học' : 'Tiếng Anh';
      const subjectIcon = isMath ? '📐' : '🌍';

      return `
        <div class="card ${item.subject}">
          <div>
            <div class="card-top">
              <span class="subject-tag ${item.subject}">
                ${subjectIcon} ${subjectLabel}
              </span>
              <span class="grade-tag">${item.grade || 'Lớp 6'}</span>
            </div>

            <h3 class="card-title" title="${item.title}">${item.title}</h3>
            <p class="card-desc">${item.description || 'Bài tập thực hành rèn luyện kiến thức.'}</p>
          </div>

          <div>
            <div class="card-meta">
              <div class="meta-item">
                <span>📝</span> ${item.questionsCount || 5} câu hỏi
              </div>
              <div class="meta-item">
                <span>💡</span> Có đáp án chi tiết
              </div>
            </div>

            <div class="card-actions">
              <a href="${item.file}" class="btn-start">
                Bắt đầu làm bài <span>→</span>
              </a>
              <button 
                class="btn-complete ${isDone ? 'done' : ''}" 
                onclick="toggleComplete('${item.id}', event)"
                title="${isDone ? 'Bấm để hủy đánh dấu' : 'Đánh dấu đã hoàn thành'}">
                ${isDone ? '✓ Đã xong' : '○ Đánh dấu'}
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function openModal() {
    document.getElementById('guide-modal').classList.add('active');
  }

  function closeModal(event) {
    if (!event || event.target === document.getElementById('guide-modal') || event.target.classList.contains('modal-close')) {
      document.getElementById('guide-modal').classList.remove('active');
    }
  }

  // Khởi chạy khi load trang
  window.addEventListener('DOMContentLoaded', () => {
    render();
  });
</script>

</body>
</html>
